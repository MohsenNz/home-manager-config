# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

command_timeout = 1500
scan_timeout = 1500

# # Use custom format
# https://starship.rs/config/#default-prompt-format
format = """
[┌── ](bold white)\
$username$hostname$localip$shlvl$singularity$kubernetes\
$nats$directory$vcsh$fossil_branch$fossil_metrics\
$git_branch$git_commit$git_state$git_metrics $git_status\
$hg_branch$hg_state$pijul_channel$docker_context\
$python$nix_shell$direnv$env_var$sudo$cmd_duration\
$jobs $battery$time$status$container$netns$os$shell
$character"""

# format = '$all'

